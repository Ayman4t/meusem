<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Museum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141217;--ink-2:#211d25;--paper:#f4f0ea;--muted:#a59ea9;--rose:#d93f5a;--rose-deep:#a82a43;--line:rgba(255,255,255,.16);
  --serif:'Cormorant Garamond','Cairo',Georgia,serif;--sans:'Inter','Cairo',system-ui,sans-serif;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--rose);outline-offset:2px}
#stage{position:relative;height:100%;width:100%;overflow:hidden;background:var(--ink)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
#fw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:89}

/* Intro */
#intro{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(16px,env(safe-area-inset-left,0px));text-align:center;background:radial-gradient(120% 90% at 50% 20%,#2a2230 0%,var(--ink) 62%);transition:opacity .8s ease}
#intro.out{opacity:0;pointer-events:none}
#introTitle{font-family:var(--serif);font-weight:500;font-size:clamp(46px,13vw,88px);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.fromto{display:flex;align-items:center;gap:14px;font-size:15px;color:var(--muted);flex-wrap:wrap;justify-content:center}
.fromto em{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--paper)}
.fromto i{width:1px;height:16px;background:var(--line)}
.bar{width:min(260px,70vw);height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--paper);transition:width .15s linear}
.pct{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-variant-numeric:tabular-nums}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.primary{background:var(--paper);color:var(--ink);border:0;border-radius:999px;padding:13px 34px;font-weight:600;letter-spacing:.02em;transition:transform .15s,opacity .3s}
.primary:disabled{opacity:.35;cursor:default}
.primary:not(:disabled):hover{transform:translateY(-1px)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:13px 24px;color:var(--paper)}
.ghost:hover{border-color:var(--muted)}
.ghost.sm{padding:8px 16px;font-size:13px}
#langBtn{position:absolute;top:max(14px,env(safe-area-inset-top,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px))}

/* HUD */
#hud{position:absolute;inset:0;z-index:20;pointer-events:none}
.brand{position:absolute;top:max(14px,env(safe-area-inset-top,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));font-family:var(--serif);font-size:20px;letter-spacing:.01em;opacity:.9;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.brand small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
#tools{position:absolute;top:max(14px,env(safe-area-inset-top,0px));inset-inline-end:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.tool{pointer-events:auto;background:rgba(20,18,23,.72);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;white-space:nowrap}
.tool:hover{border-color:var(--muted)}
.tool.ring{background:linear-gradient(135deg,#d93f5a,#a82a43);border-color:transparent;font-size:14px;font-weight:600;padding:11px 20px;box-shadow:0 8px 24px rgba(217,63,90,.5)}
body.letterMode #mapBox,body.letterMode .brand,body.letterMode #hint,body.letterMode #tools,body.letterMode #capPill,body.letterMode #liveChat{display:none!important}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:95;transition:opacity .55s ease}
#mapBox{position:absolute;top:calc(max(14px,env(safe-area-inset-top,0px)) + 52px);inset-inline-start:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
#map{width:84px;height:124px;border-radius:8px;border:1px solid var(--line);display:block}
#mapTxt{font-size:11.5px;color:var(--paper);text-shadow:0 1px 6px rgba(0,0,0,.7);letter-spacing:.02em}
#hint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:rgba(20,18,23,.62);backdrop-filter:blur(8px);font-size:12.5px;color:var(--muted);text-align:center;width:max-content;max-width:calc(100% - 32px);transition:opacity .6s}
#exitPill{position:absolute;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 100px);transform:translateX(-50%);z-index:6}
#exitBtn{border:0;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700;background:rgba(20,16,20,.88);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#exitBtn kbd{background:#3a343a;border-radius:6px;padding:1px 7px;margin-left:6px;font:inherit;font-size:12px}
#exitBox{position:absolute;inset:0;z-index:30;background:rgba(10,6,10,.6);display:flex;align-items:center;justify-content:center}
#exitBox[hidden]{display:none}
#exitBox .eb{background:#fff6f0;color:#3a1d28;border-radius:20px;padding:22px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#exitBox p{margin:0 0 16px;font-size:18px;font-weight:600}
#exitBox button{border:0;border-radius:999px;padding:10px 22px;margin:0 6px;font-size:15px;font-weight:600;background:#eadad8;color:#3a1d28}
#exitGo{background:linear-gradient(135deg,#e8506b,#a82a43)!important;color:#fff!important}
#capPill{position:absolute;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 46px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:10px 10px 10px 20px;border-radius:999px;background:rgba(20,18,23,.78);backdrop-filter:blur(10px);border:1px solid var(--line);pointer-events:auto}
#capText{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.1;min-width:0;overflow-wrap:anywhere}
#capPill button{flex:none;border:0;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
#capBtn{background:var(--paper);color:var(--ink)}
#capListen{background:var(--rose);color:#fff}
#capOpen{background:#ffb3bf;color:#2b1f22;animation:beat 1.4s ease-in-out infinite}
#toast{position:absolute;left:50%;top:max(70px,calc(env(safe-area-inset-top,0px) + 56px));transform:translate(-50%,-8px);z-index:95;padding:10px 18px;border-radius:999px;background:rgba(244,240,234,.96);color:var(--ink);font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Bubbles and name tags */
#bubbles{position:absolute;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.tag,.bubble{position:absolute;left:0;top:0;will-change:transform}
.tag span{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;background:rgba(20,18,23,.78);color:var(--paper);font-size:11.5px;font-weight:500}
.tag span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rose)}
.bubble span{display:block;width:max-content;max-width:min(240px,62vw);padding:9px 15px;border-radius:18px;background:#fff;color:#18151b;font-size:15px;font-weight:600;line-height:1.3;box-shadow:0 6px 22px rgba(0,0,0,.35);transition:opacity .35s,translate .35s}
.bubble.gone span{opacity:0;translate:0 6px}

/* Joystick */
#stick{position:absolute;z-index:25;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(max(22px,env(safe-area-inset-bottom,0px)) + 40px);width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(244,240,234,.8)}

/* Letter */
#letter{position:absolute;left:0;right:0;bottom:0;z-index:48;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:16px max(16px,env(safe-area-inset-left,0px)) max(26px,env(safe-area-inset-bottom,0px));pointer-events:none;opacity:0;transition:opacity .9s ease}
#letter .letter-btns{pointer-events:auto}
#paper{display:none!important}
#letter.in{opacity:1}
#paper{width:min(520px,100%);min-height:90px;max-height:44vh;overflow:auto;background:#f4ecdf;color:#3a2b2b;border-radius:6px;padding:20px 24px;font-family:var(--serif);font-size:clamp(19px,4.2vw,25px);line-height:1.38;white-space:pre-wrap;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.letter-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* The question */
#ask{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,5vh) max(16px,env(safe-area-inset-left,0px)) 24px;background:linear-gradient(to bottom,rgba(12,10,14,.82) 0,rgba(12,10,14,.4) 34%,rgba(12,10,14,0) 58%,rgba(12,10,14,.55) 100%);opacity:0;transition:opacity 1.2s ease;overflow:hidden}
#ask.in{opacity:1}
.ask-card{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;width:min(560px,100%)}
.heart{width:44px;height:44px;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#askQ{font-family:var(--serif);font-weight:500;font-size:clamp(34px,8vw,58px);line-height:1.05;margin:0;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.6)}
#askSub{font-family:var(--serif),'Cairo',sans-serif;font-style:italic;line-height:1.5;font-size:clamp(16px,3.8vw,23px);color:#cfc8d2;margin:0;min-height:1.3em;text-wrap:balance;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.choices{position:absolute;left:0;right:0;bottom:calc(max(24px,env(safe-area-inset-bottom,0px)) + 6vh);display:flex;align-items:center;justify-content:center;gap:22px;min-height:70px}
.yes{background:var(--rose);color:#fff;border:0;border-radius:999px;padding:14px 44px;font-size:20px;font-weight:600;box-shadow:0 10px 30px rgba(217,63,90,.38),inset 0 -3px 0 var(--rose-deep);transform:scale(var(--s,1));transition:transform .35s cubic-bezier(.3,1.5,.5,1);z-index:2}
.no-slot{display:inline-block;width:78px;height:50px}
.no{position:fixed;left:0;top:0;z-index:3;background:var(--paper);color:var(--ink);border:0;border-radius:999px;padding:12px 28px;font-size:16px;font-weight:600;transition:left .28s cubic-bezier(.3,1.4,.5,1),top .28s cubic-bezier(.3,1.4,.5,1),opacity .4s,transform .4s}
.no.tiny{transform:scale(.7)}
#askBack{position:absolute;left:50%;bottom:calc(max(24px,env(safe-area-inset-bottom,0px)) + 6vh);transform:translateX(-50%);margin:0}
#askBack:not(:disabled):hover{transform:translateX(-50%) translateY(-1px)}
#askTools{position:absolute;left:0;right:0;bottom:calc(max(24px,env(safe-area-inset-bottom,0px)) + 6vh + 62px);display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Lightbox */
#lightbox{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px max(16px,env(safe-area-inset-left,0px));background:rgba(10,8,12,.92);cursor:zoom-out}
#lbImg,#lbVid{max-width:100%;max-height:calc(100% - 110px);border-radius:3px;box-shadow:0 20px 70px rgba(0,0,0,.6)}
#lbCap{font-family:var(--serif);font-style:italic;font-size:26px;text-align:center}
#lbDate{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Guestbook */
#gb{position:absolute;inset:0;z-index:75;background:rgba(10,8,12,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.gb-card{width:min(460px,100%);max-height:88%;display:flex;flex-direction:column;gap:12px;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:20px}
.gb-card header{display:flex;align-items:center;justify-content:space-between}
.gb-card h2{font-family:var(--serif);font-weight:500;font-size:28px;margin:0}
.gb-card textarea,.ed-card textarea{width:100%;min-height:76px;resize:vertical;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--paper);padding:10px 12px;font:inherit}
#gbList{overflow:auto;display:flex;flex-direction:column;gap:10px;color:var(--muted);font-size:14px}
.gb-note{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.gb-note p{margin:0 0 4px;color:var(--paper);white-space:pre-wrap;overflow-wrap:anywhere}
.gb-note small{color:var(--muted)}

/* Editor */
#editor{position:absolute;inset:0;z-index:80;background:rgba(10,8,12,.8);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 32px}
.ed-card{width:min(760px,100%);background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px}
.ed-card header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ed-card h2{font-family:var(--serif);font-weight:500;font-size:32px;margin:0}
.ed-card h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;font-weight:600}
.note{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.ed-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-size:12px;color:var(--muted)}
.fld input[type=text],.ph-card input[type=text]{width:100%;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--paper);padding:10px 12px;font:inherit}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .st{font-size:12px;color:var(--muted)}
.ed-photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.ph-card{display:flex;flex-direction:column;gap:8px;min-width:0}
.ph{aspect-ratio:3/4;width:100%;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;padding:6px;font-size:12px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.ph-actions{display:flex;gap:6px;flex-wrap:wrap}
.mini{flex:1;text-align:center;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:12.5px;cursor:pointer;color:var(--paper);min-width:64px}
.mini:hover{border-color:var(--muted)}
.mini.on{border-color:var(--rose);color:var(--rose)}
.ed-card footer{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}

#invite{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(420px,92vw)}
#invite .r{display:flex;gap:8px;width:100%}
#invLink{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:999px;color:var(--paper);padding:9px 14px;font:inherit;font-size:12.5px;direction:ltr}
#liveChat{position:absolute;z-index:26;inset-inline-end:max(12px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;width:min(250px,44vw)}
#lcIn{flex:1;min-width:0;background:rgba(20,18,23,.78);border:1px solid var(--line);border-radius:999px;color:var(--paper);padding:8px 12px;font:inherit;font-size:13px}
#intro{background:none;transition:none}
#intro.out{opacity:1;pointer-events:none}
.door{position:absolute;top:0;bottom:0;width:50.4%;z-index:0;background:linear-gradient(180deg,#2c2432,#17131c);box-shadow:inset 0 0 90px rgba(0,0,0,.65);transition:transform 1.6s cubic-bezier(.75,0,.25,1)}
.door::after{content:"";position:absolute;inset:7% 11%;border:1px solid rgba(201,163,90,.38);border-radius:6px;box-shadow:inset 0 0 0 6px rgba(0,0,0,.18)}
#doorL{left:0;border-right:2px solid #c9a35a}#doorR{right:0;border-left:2px solid #c9a35a}
#intro.out #doorL{transform:translateX(-102%)}#intro.out #doorR{transform:translateX(102%)}
#intro #langBtn{z-index:3;transition:opacity .4s}#intro.out #langBtn{opacity:0}
.ticket{position:relative;z-index:2;width:min(390px,90vw);background:#f4ecdf;color:#3a2b2b;border-radius:12px;padding:22px 26px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 26px 70px rgba(0,0,0,.6),inset 0 0 0 5px #f4ecdf,inset 0 0 0 6px rgba(168,42,67,.35);transition:opacity .5s,transform .9s}
#intro.out .ticket{opacity:0;transform:translateY(-16px) scale(.96)}
.tk-top{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#a82a43;font-weight:600}
.tk-date{font-family:var(--serif);font-style:italic;font-size:17px;color:#6b5757}
.tk-stub{position:relative;width:100%;border-top:2px dashed rgba(58,43,43,.32);padding-top:16px;margin-top:2px;display:flex;flex-direction:column;align-items:center;gap:12px}
.tk-stub::before,.tk-stub::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:#1d1822}
.tk-stub::before{left:-37px}.tk-stub::after{right:-37px}
.ticket #introTitle{color:#2b1f22;font-size:clamp(40px,11vw,62px)}
.ticket .fromto{color:#6b5757}.ticket .fromto em{color:#2b1f22}.ticket .fromto i{background:rgba(58,43,43,.3)}
.ticket .bar{background:rgba(58,43,43,.14)}.ticket .bar b{background:#a82a43}
.ticket .pct,.ticket .note{color:#6b5757}
.ticket .primary{background:#2b1f22;color:#f4ecdf}
.ticket .ghost{border-color:rgba(58,43,43,.35);color:#3a2b2b}
.ticket .ghost:hover{border-color:#a82a43}
.ticket #invLink{background:#fff8ee;color:#3a2b2b;border-color:rgba(58,43,43,.25)}

/* lovely home */
.door{background:radial-gradient(circle at 50% 30%,rgba(255,143,168,.18),transparent 55%),linear-gradient(180deg,#4a1f36,#1f0f1b)!important}
.door::after{border:1px solid rgba(240,190,170,.55)!important;border-radius:60px 60px 8px 8px!important;box-shadow:inset 0 0 0 6px rgba(255,143,168,.08),inset 0 0 60px rgba(217,63,90,.18)!important}
#doorL{border-right:2px solid #e8b4a0!important}#doorR{border-left:2px solid #e8b4a0!important}
#introHearts{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;transition:opacity .5s}
#intro.out #introHearts{opacity:0}
#introHearts span{position:absolute;bottom:-40px;color:#ff7d96;opacity:0;animation:floatUp var(--d,12s) linear var(--dl,0s) infinite;font-size:var(--sz,18px);filter:drop-shadow(0 0 6px rgba(255,125,150,.6))}
@keyframes floatUp{0%{transform:translateY(0) translateX(0) rotate(-8deg);opacity:0}12%{opacity:.85}50%{transform:translateY(-55vh) translateX(18px) rotate(8deg)}100%{transform:translateY(-115vh) translateX(-14px) rotate(-6deg);opacity:0}}
.ticket{background:linear-gradient(160deg,#fff6f0 0%,#ffe4ea 100%)!important;box-shadow:0 0 90px rgba(255,125,150,.35),0 26px 70px rgba(0,0,0,.55),inset 0 0 0 5px #fff6f0,inset 0 0 0 6px rgba(217,63,90,.45)!important}
.tk-stub::before,.tk-stub::after{background:#321424!important}
.tk-top{color:#d93f5a!important;letter-spacing:.34em}
.tk-heart{width:46px;height:46px;animation:beat 1.4s ease-in-out infinite;filter:drop-shadow(0 4px 10px rgba(217,63,90,.45))}
.ticket #introTitle{background:linear-gradient(120deg,#a82a43,#d93f5a 55%,#e8806f);-webkit-background-clip:text;background-clip:text;color:transparent!important;-webkit-text-fill-color:transparent}
.ticket .fromto em{color:#a82a43!important}
.ticket .tk-date{color:#9a6a72}
.ticket .bar b{background:linear-gradient(90deg,#ff7d96,#d93f5a)!important}
.ticket .primary{background:linear-gradient(135deg,#e8506b,#a82a43)!important;color:#fff!important;box-shadow:0 8px 22px rgba(217,63,90,.4)}
.ticket .primary:disabled{box-shadow:none}

  }
}

(function(){ var b=$('introHearts'); for(var i=0;i<22;i++){ var h=document.createElement('span'); h.textContent='♥'; h.style.left=(Math.random()*96)+'%'; h.style.setProperty('--sz',(12+Math.random()*22).toFixed(0)+'px'); h.style.setProperty('--d',(9+Math.random()*9).toFixed(1)+'s'); h.style.setProperty('--dl',(-Math.random()*14).toFixed(1)+'s'); b.appendChild(h); } })();
tkDate(); $('langBtn').addEventListener('click',tkDate);
$('askBack').addEventListener('click',function(){ fwOn=false; });
$('tRing').textContent=lt('ring');
$('tRing').addEventListener('click',function(){ if(ROLE!=='host'||!linked||state!=='explore'||ringBusy) return; ringBusy=true; send({t:'ring'}); closeLightbox(); fadeThen(hostEnterCine,750); });
/* he opens an invitation */
$('inviteBtn').textContent=lt('inv'); if(JOIN) $('inviteBtn').hidden=true;
$('inviteBtn').addEventListener('click',function(){
  if(ROLE) return; ROLE='host'; swapAvatars(); $('inviteBtn').hidden=true; $('customize').hidden=true;
  var box=$('invite'); box.hidden=false; $('invCopy').textContent=lt('copy'); $('invSt').textContent='…'; $('invNote').textContent=lt('once')+(location.protocol==='file:'?' '+lt('host'):'');
  loadPeer(function(){
    var id='om-'+rnd(12), tok=hexTok(8); peer=new Peer(id,{config:ICE});
    peer.on('open',function(){ var h=location.hash.split('&')[0]; $('invLink').value=location.href.split('#')[0]+(/^#m=/.test(h)?h+'&':'#')+'join='+id+'.'+tok; $('invSt').textContent=lt('wait'); });
    peer.on('error',function(){ $('invSt').textContent=lt('fail'); });
    peer.on('connection',function(c){
      c.on('data',function(d){
        if(c!==conn){
          if(d&&d.t==='hi'){
            if(d.tok!==tok||(lockCid&&d.cid!==lockCid)){ try{ c.send({t:'no'}); }catch(e){} setTimeout(function(){ try{ c.close(); }catch(e){} },400); return; }
            lockCid=d.cid; if(conn){ try{ conn.close(); }catch(e){} } conn=c; c.send({t:'ok'}); onLinked();
          }
        } else onMsg(d);
      });
    });
  });
});
$('langBtn').addEventListener('click',function(){ $('tRing').textContent=lt('ring'); $('inviteBtn').textContent=lt('inv'); $('invCopy').textContent=lt('copy'); $('lcIn').placeholder=lt('say'); $('lcGo').textContent=lt('send'); });
$('invCopy').addEventListener('click',function(){ var v=$('invLink').value; if(!v) return; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(function(){ toast(lt('copied')); },function(){ window.prompt('Link',v); }); else window.prompt('Link',v); });

/* she opens it */
if(JOIN){
  $('pct').dataset.live='1'; toast(lt('conn'),2500);
  loadPeer(function(){
    peer=new Peer(undefined,{config:ICE});
    var rt=null; function retry(){ if(denied||linked||rt) return; rt=setTimeout(function(){ rt=null; tryConn(); },4000); }
    function tryConn(){
      if(linked||denied||!peer||peer.destroyed) return;
      var c=peer.connect(JOIN.id,{reliable:true}), to=setTimeout(function(){ try{ c.close(); }catch(e){} toast(lt('off'),2500); retry(); },9000);
      c.on('open',function(){ c.send({t:'hi',tok:JOIN.tok,cid:CID}); });
      c.on('data',function(d){ if(d&&d.t==='ok'){ clearTimeout(to); conn=c; onLinked(); } else if(d&&d.t==='no'){ clearTimeout(to); denied=true; toast(lt('taken'),5000); } else if(c===conn) onMsg(d); });
      c.on('close',function(){ if(conn===c){ conn=null; linked=false; rem.got=false; retry(); } });
    }
    peer.on('open',tryConn); peer.on('error',function(e){ if(e&&e.type==='peer-unavailable'){ clearTimeout(0); toast(lt('off'),2500); retry(); } else toast(lt('fail'),3000); });
  });
}

requestAnimationFrame(frame);
})();
