<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Museum of Love</title>
<script>/* set language + direction before first paint, keep the ticket hidden until texts are ready (no English flash) */
(function(){var d=document.documentElement,l='en';try{var x=localStorage.getItem('ourMuseum.lang');if(x==='ar'||x==='en')l=x;}catch(e){}
var m=/^#m=/.test(location.hash);if(!m){d.lang=l;d.dir=l==='ar'?'rtl':'ltr';}
setTimeout(function(){var p=document.getElementById('preload');if(p)p.classList.add('gone');},4500);})();</script>
<style>
#preload{position:fixed;inset:0;z-index:99999;background:#1a0d14;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease;pointer-events:all}
#preload.gone{opacity:0;pointer-events:none}
#preload .pb{width:min(220px,50vw);height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
#preload .pb b{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,#ff7d96,#d93f5a);animation:pbRun 1.1s ease-in-out infinite}
@keyframes pbRun{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
html[lang=ar] .tk-en,html[lang=ar] .tk-dot{display:none}
html[lang=en] .tk-ar,html[lang=en] .tk-dot{display:none}
</style>
<meta name="description" content="I made you a whole museum 🥹 — a private invitation, just for you. · عملتلك متحف كامل، دعوة خاصة ليكي 💌">
<meta property="og:type" content="website">
<meta property="og:title" content="Museum of Love 💌">
<meta property="og:description" content="I made you a whole museum 🥹 — a private invitation, just for you. · عملتلك متحف كامل، دعوة خاصة ليكي">
<meta property="og:image" content="https://YOUR-DOMAIN.com/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://YOUR-DOMAIN.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Museum of Love 💌">
<meta name="twitter:image" content="https://YOUR-DOMAIN.com/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/01-base-intro.css">
<link rel="stylesheet" href="css/02-hud-bubbles.css">
<link rel="stylesheet" href="css/03-letter-question.css">
<link rel="stylesheet" href="css/04-lightbox-guestbook.css">
<link rel="stylesheet" href="css/05-editor-music.css">
<link rel="stylesheet" href="css/06-ux-love-theme.css">
<link rel="stylesheet" href="css/07-light-theme.css">
<link rel="stylesheet" href="css/08-dark-entry.css">
<link rel="stylesheet" href="css/09-overrides.css">
<link rel="stylesheet" href="css/10-gift.css">
</head>
<body>
<div id="preload" aria-hidden="true"><div class="pb"><b></b></div></div>

<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="darkVeil"></canvas>
  <div id="loveFlight" aria-hidden="true"></div><div id="darkMsg" aria-live="polite"></div><div id="darkHearts" hidden></div><button id="darkSkip" hidden type="button"></button>
  <div id="bubbles"></div>

  <div id="hud" hidden>
    <div id="loveFx" aria-hidden="true"></div><div class="brand" id="brand"></div>
    <div id="tools">
      <button class="tool ring" id="tRing" hidden></button>
      <button class="tool" id="hudShot" hidden></button>
      <button class="tool" id="hudRec" hidden></button>
    </div>
    <div id="mapBox"><canvas id="map" width="168" height="248"></canvas><div id="mapTxt"></div></div>
    <div id="capPill" hidden><span id="capText"></span><button id="capListen" hidden></button><button id="capOpen" hidden></button><button id="capBtn"></button></div>
    <div id="hint"></div>
    <div id="exitPill" hidden><button id="exitBtn">🚪 Exit <kbd>X</kbd></button></div>
    <div id="exitBox" hidden><div class="eb"><p id="exitQ">Leave the museum?</p><div><button id="exitStay">Stay</button><button id="exitGo">Leave</button></div></div></div>
    <section id="tourGuide" hidden aria-live="polite" aria-label="Guided museum tour">
      <div class="tour-top"><span id="tourProgress"></span><span>♥</span></div>
      <div class="tour-body"><div id="tourArrow" aria-hidden="true">↑</div><div class="tour-copy"><strong id="tourTitle"></strong><span id="tourMessage"></span></div></div>
      <div class="tour-foot"><span id="tourDistance"></span><button id="tourStop"></button></div>
    </section>
    <div id="cinemaUploadPill" hidden><button id="cinemaUploadBtn" type="button"></button><input id="cinemaUploadInput" type="file" accept="video/*" hidden></div>
  </div>
  <div id="stick" hidden><div id="knob"></div></div>
  <div id="toast"></div>
  <div id="liveChat" hidden><input id="lcIn" type="text" maxlength="80"><button class="ghost sm" id="lcGo"></button></div>

  <button id="giftBtn" type="button" hidden></button>
  <div id="giftModal" hidden><div class="gm-card" role="dialog" aria-modal="true" aria-labelledby="gmT">
    <div class="gm-lock" aria-hidden="true">🔒</div><h3 id="gmT"></h3><p id="gmS"></p>
    <input id="gmIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40">
    <p class="gm-hint" id="gmH"></p><p class="gm-err" id="gmE" aria-live="polite"></p>
    <div class="gm-row"><button type="button" class="gm-ok" id="gmOk"></button><button type="button" class="gm-no" id="gmNo"></button></div>
  </div></div>

  <section id="intro">
    <div class="door" id="doorL"></div><div class="door" id="doorR"></div>
    <button class="ghost sm" id="langBtn"></button>
    <div id="introHearts"></div>
    <div class="ticket"><svg class="tk-heart" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8fa8"/><stop offset="1" stop-color="#c8284a"/></linearGradient></defs><path d="M32 56C14 42 6 32 6 21 6 13 12 8 19 8c5 0 10 3 13 8 3-5 8-8 13-8 7 0 13 5 13 13 0 11-8 21-26 35z" fill="url(#hg)"/></svg><div class="tk-top"><span class="tk-en">Admit one</span><span class="tk-dot">·</span><span class="tk-ar" lang="ar">تذكرة دخول</span></div><h1 id="introTitle">Museum of Love</h1>
    <div class="fromto"><span data-i="from"></span> <em id="introFrom"></em><i></i><span data-i="to"></span> <em id="introTo"></em></div>
    <div class="tk-date" id="tkDate"></div>
    <div class="tk-stub"><div class="bar"><b id="barFill"></b></div>
    <div class="pct" id="pct"></div>
    <div class="btn-row">
      <button class="primary" id="enter" disabled data-i="enter"></button>
      <button class="ghost" id="customize" data-i="customize"></button>
      <button class="ghost" id="inviteBtn"></button>
    </div>
    <div id="invite" hidden><label class="dkToggle"><input type="checkbox" id="invDark" checked><span id="invDarkTxt"></span></label><div class="r"><input id="invLink" type="text" readonly><button class="ghost sm" id="invCopy"></button></div><div class="pct" id="invSt"></div><p class="note" id="invNote"></p></div>
    </div></div>
  </section>

  <section id="letter" hidden>
    <div id="paper"></div>
    <div class="letter-btns">
      <button class="ghost sm" id="letVoice" hidden></button>
      <button class="primary" id="letGo"></button>
    </div>
  </section>

  <section id="ask" hidden>
    <div class="ask-card">
      <svg class="heart" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 56C14 42 6 32 6 21 6 13 12 8 19 8c5 0 10 3 13 8 3-5 8-8 13-8 7 0 13 5 13 13 0 11-8 21-26 35z" fill="#d93f5a"/></svg>
      <h2 id="askQ"></h2>
      <p id="askSub"></p>
    </div>
    <div class="choices" id="choices">
      <button class="yes" id="yes"></button>
      <span class="no-slot" id="noSlot"></span>
      <button class="no" id="no"></button>
    </div>
    <div id="askMini"><button type="button" id="amSfx" class="tool icon"></button><button type="button" id="amMusic" class="tool icon"></button><button type="button" id="amTrack" class="tool icon">🎼</button></div>
    <div id="askTools" hidden>
      <button class="ghost sm" id="askSfx" type="button"></button>
      <button class="ghost sm" id="askShot"></button>
      <button class="ghost sm" id="askRec"></button>
    </div>
    <button class="primary" id="askBack" hidden></button>
  </section>

  <div id="lightbox" hidden><img id="lbImg" alt=""><video id="lbVid" controls playsinline loop hidden></video><div id="lbCap"></div><div id="lbDate"></div></div>

  <div id="gb" hidden role="dialog">
    <div class="gb-card">
      <header><h2 id="gbTitle"></h2><button class="ghost sm" id="gbClose"></button></header>
      <textarea id="gbText" maxlength="400"></textarea>
      <button class="primary" id="gbAdd"></button>
      <div id="gbList"></div>
    </div>
  </div>

  <div id="editor" hidden role="dialog">
    <div class="ed-card">
      <header><h2 id="edTitle"></h2><button class="ghost" id="edClose"></button></header>
      <p class="note" id="edNote"></p>
      <div class="emoji-bar" id="edEmoji"></div>
      <div class="ed-grid" id="edText"></div>
      <div class="ed-grid" id="edExtra"></div>
      <div id="edAudio" class="ed-grid"></div>
      <h3 id="edCinemaH"></h3><p class="note" id="edCinemaNote"></p><div id="edCinema" class="ed-grid"></div>
      <h3 id="edCharsH"></h3><p class="note" id="edCharsNote"></p><div class="row"><button class="ghost" id="edChars"></button></div>
      <h3 id="edWalls"></h3>
      <div class="ed-photos" id="edPhotos"></div>
      <h3 id="edShareH"></h3>
      <p class="note" id="edShareNote"></p>
      <div class="row"><button class="ghost" id="shCopy"></button><button class="ghost" id="shFile" hidden></button><span class="st" id="shSt"></span></div>
      <footer><button class="ghost" id="edReset"></button><button class="primary" id="edSave"></button></footer>
    </div>
  </div>

  <div id="fade"></div>
  <canvas id="fw"></canvas>
  <canvas id="confetti"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/00-sunset-photo.js"></script>
<script src="js/01-config.js"></script>
<script src="js/02-dom-storage.js"></script>
<script src="js/03-audio.js"></script>
<script src="js/04-scene.js"></script>
<script src="js/05-rooms-frames.js"></script>
<script src="js/06-avatars.js"></script>
<script src="js/07-controls-ui.js"></script>
<script src="js/08-dark-entrance.js"></script>
<script src="js/09-story.js"></script>
<script src="js/10-main-loop.js"></script>
<script src="js/11-customize-share.js"></script>
<script src="js/12-live.js"></script>
<script src="js/13-upgrades.js"></script>
<script src="js/14-music-picker.js"></script>
<script src="js/15-avatar-faces.js"></script>
<script src="js/16-observatory-plane.js"></script>
<script src="js/17-rooms-extras.js"></script>
<script src="js/18-boot.js"></script>
</body></html>
