<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0d14">
  <title>Museum of Love</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#1a0d14}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="museumApp" title="Museum of Love" allow="autoplay; camera; microphone; fullscreen; clipboard-write"></iframe>
  <script>
    var appUrl=new URL('index.html',location.href);
    appUrl.searchParams.set('museum','1'); appUrl.searchParams.set('v',String(Date.now()));
    appUrl.hash=location.hash;
    document.getElementById('museumApp').src=appUrl.href;
  </script>
</body>
</html>
